ww.w3.org/2000/svg' width='1400' height='420'%3E%3Crect width='1400' height='420' fill='%230e4966'/%3E%3Ccircle cx='220' cy='210' r='120' fill='%2318c7ff' opacity='.45'/%3E%3Crect x='420' y='100' width='780' height='55' rx='12' fill='%23fff' opacity='.18'/%3E%3Crect x='420' y='190' width='560' height='38' rx='10' fill='%23fff' opacity='.12'/%3E%3C/svg%3E"></div><form class="admin-file-meta-form"><label><span>الاسم</span><input value="dashboard-wide-reference.png"></label><label><span>ملفات المشروع</span><select><option>متطلبات العميل</option></select></label><label><span>الظهور</span><select><option>للعميل</option></select></label><div class="form-actions"><button class="primary-btn compact-btn">حفظ</button><button class="danger-btn compact-btn">أرشفة الملف</button></div></form></div></section></div></section></main></div></div></section><script>document.documentElement.dataset.r4Mode="files";</script><script>(() => {
  const mode = document.documentElement.dataset.r4Mode || 'support';
  const failures = [];
  const fail = (m) => failures.push(m);
  const el = (s) => document.querySelector(s);
  const rect = (s) => el(s)?.getBoundingClientRect() || null;
  const css = (s) => el(s) ? getComputedStyle(el(s)) : null;
  const withinViewport = (r) => r && r.left >= -1 && r.right <= innerWidth + 1 && r.top >= -1 && r.bottom <= innerHeight + 1;
  const layer = rect('.project-workspace-layer');
  const body = rect('.project-workspace-body');
  const content = rect('.project-workspace-content');
  if (!layer || !body || !content) fail('workspace shell missing');
  if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) fail('document horizontal overflow');
  if (document.documentElement.scrollHeight > document.documentElement.clientHeight + 1) fail('document vertical overflow');
  if (layer && (Math.abs(layer.width - innerWidth) > 2 || Math.abs(layer.height - innerHeight) > 2)) fail('workspace is not viewport-sized');
  if (content && (content.height < 250 || !withinViewport(content))) fail('workspace content is clipped');

  if (mode === 'support') {
    const support = rect('.admin-support-workspace');
    const side = rect('.admin-ticket-sidebar');
    const detail = rect('.admin-ticket-detail');
    if (!support || !detail) fail('ticket workspace missing');
    if (support && content && Math.abs(support.height - content.height) > 2) fail('ticket workspace escapes content track');
    if (innerWidth >= 761 && support && side && detail) {
      const sideRatio = side.width / support.width;
      const detailRatio = detail.width / support.width;
      if (sideRatio < .30 || sideRatio > .42) fail('ticket list ratio outside 30-42%');
      if (detailRatio < .56 || detailRatio > .69) fail('ticket detail ratio outside 56-69%');
    }
    const clientMessage = rect('.admin-message.is-client .admin-message-content');
    if (clientMessage && clientMessage.width < 180 && innerWidth >= 768) fail('client message collapsed into narrow column');
    const accessTab = [...document.querySelectorAll('[class*="project-workspace"] button')].find(b => b.textContent.includes('وصول العميل'));
    if (!accessTab) fail('Client Access primary tab missing');
    if (innerWidth >= 1024 && accessTab && !withinViewport(accessTab.getBoundingClientRect())) fail('Client Access tab not discoverable on desktop');
    if (innerWidth <= 760) {
      const back = el('.admin-ticket-mobile-back');
      if (!back || css('.admin-ticket-mobile-back').display === 'none') fail('mobile ticket back action missing');
      if (side && css('.admin-ticket-sidebar').display !== 'none') fail('mobile selected ticket still shows list pane');
      if (detail && css('.admin-ticket-detail').display === 'none') fail('mobile selected ticket detail hidden');
    }
  }

  if (mode === 'files') {
    const ws = rect('.admin-files-workspace');
    const folder = rect('.admin-folder-rail');
    const list = rect('.admin-files-list-pane');
    const detail = rect('.admin-file-detail');
    if (!ws || !folder || !list || !detail) fail('three-pane file workspace missing');
    if (ws && content && innerWidth >= 761 && Math.abs(ws.height - content.height) > 2) fail('files workspace escapes content track');
    if (innerWidth >= 1024 && ws && folder && list && detail) {
      const sum = folder.width + list.width + detail.width;
      if (sum < ws.width * .88) fail('file panes do not use workspace width');
      if (detail.width < ws.width * .35) fail('file preview pane too narrow');
    }
    const imgStyle = css('.admin-file-preview img');
    if (!imgStyle || imgStyle.objectFit !== 'contain') fail('image preview is not object-fit contain');
    if (innerWidth <= 760 && css('.admin-files-workspace')?.overflowY === 'visible') fail('mobile files lacks local scroll containment');
  }

  if (mode === 'access') {
    const access = rect('.project-access-workspace');
    const input = rect('.generated-project-link input');
    const copy = rect('.generated-project-link .primary-btn');
    const generate = rect('.project-access-form .primary-btn');
    if (!access || !input || !copy || !generate) fail('client access link controls missing');
    if (access && content && access.height > content.height + 2) fail('client access workspace escapes content track');
    if (copy && (copy.width < 90 || copy.height < 36)) fail('copy-link action is not prominent');
    if (generate && generate.height < 36) fail('generate-link action is not prominent');
  }

  const out = document.createElement('output');
  out.id = 'nx-r4-visual-gate';
  out.dataset.result = failures.length ? 'FAIL' : 'PASS';
  out.dataset.mode = mode;
  out.dataset.width = String(innerWidth);
  out.dataset.height = String(innerHeight);
  out.textContent = failures.length ? failures.join(' | ') : 'PASS';
  out.style.display = 'none';
  document.body.append(out);
})();
</script></body></html>
