<!doctype html><html lang="en"><meta charset="utf-8"><title>NEXORA R5 — reference comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#16212c;color:#eef6fa;font:14px Arial}header{height:64px;display:flex;align-items:center;gap:12px;padding:12px;position:sticky;top:0;background:#16212c;z-index:2}label{display:flex;gap:5px;align-items:center}select,button{font:inherit;padding:7px;background:#233746;color:white;border:1px solid #547284;border-radius:6px}main{width:max-content;display:flex;gap:16px;padding:0}iframe{border:0;display:block}section{display:grid;gap:4px}h2{margin:0;font-size:13px;padding:4px}#evidence{font:12px monospace;white-space:pre-wrap;max-width:100vw;padding:12px;line-height:1.6}a{color:#8edfff}</style>
<header><strong>R5 reference comparison</strong><label>View<select id="view"><option value="runtime">Implementation</option><option value="reference">Approved reference</option><option value="both">Both</option></select></label><label>Viewport<select id="size"><option>1440x900</option><option>1366x768</option><option>1280x720</option><option>1024x768</option><option>768x1024</option><option>390x844</option><option>360x800</option></select></label><label>Theme<select id="theme"><option>dark</option><option>light</option></select></label><label>Language<select id="lang"><option>ar</option><option>en</option></select></label><label>Case<select id="case"><option>basic</option><option>long</option><option>empty</option><option>closed</option></select></label><button id="inspect">Inspect layout</button></header>
<main id="frames"></main><pre id="evidence"></pre>
<script>
const frames=document.querySelector('#frames'),evidence=document.querySelector('#evidence');
function render(){const [w,h]=document.querySelector('#size').value.split('x');const view=document.querySelector('#view').value;frames.innerHTML='';for(const kind of view==='both'?['reference','runtime']:[view]){const section=document.createElement('section');const frame=document.createElement('iframe');frame.id=kind;frame.title=kind==='runtime'?'NEXORA implementation':'Approved reference';frame.width=w;frame.height=h;const params=new URLSearchParams({theme:document.querySelector('#theme').value,lang:document.querySelector('#lang').value,case:document.querySelector('#case').value});frame.src=kind==='reference'?'/reference.html':'/admin/?'+params;section.append(frame);frames.append(section)}evidence.textContent='UI fixture data only. No production backend or data connection.';}
for(const select of document.querySelectorAll('header select'))select.onchange=render;
document.querySelector('#inspect').onclick=()=>{const f=document.querySelector('#runtime');if(!f)return;evidence.textContent=JSON.stringify(f.contentWindow.uiProof(),null,2)};
render();
</script></html>
